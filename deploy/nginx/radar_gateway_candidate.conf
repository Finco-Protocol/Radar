# Reviewable nginx staging/production path-routing candidate (Option B — M3).
# NOT deployed automatically; requires owner review and staging verification.
# Preserves exact public URLs without any broad /api/v1/ or /api/v1.1/ takeover.

upstream finco_model_backend {
    server 127.0.0.1:8000;
}

upstream finco_radar_backend {
    server 127.0.0.1:8010;
}

server {
    listen 80;
    server_name _;

    # ── Radar-owned UI & API route families (exact prefixes only) ─────────
    location = /radar {
        proxy_pass http://finco_radar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /radar/ {
        proxy_pass http://finco_radar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /crypto {
        proxy_pass http://finco_radar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /crypto/ {
        proxy_pass http://finco_radar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/radar/ {
        proxy_pass http://finco_radar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/crypto/ {
        proxy_pass http://finco_radar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1.1/radar/ {
        proxy_pass http://finco_radar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1.1/rwa-basis/ {
        proxy_pass http://finco_radar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Block public access to internal auth introspection endpoint ────────
    location ^~ /internal/ {
        return 403;
    }

    # ── Model-owned default upstream (/v2/*, /api/v1/model/*, /api/v1.1/runs/*, /verify*, /.well-known/*) ─
    location / {
        proxy_pass http://finco_model_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
