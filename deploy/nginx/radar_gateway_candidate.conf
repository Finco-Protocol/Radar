# Candidate nginx gateway configuration for Option B split (Model + Radar)
# Reviewable artifact only — NOT deployed to live infrastructure.
# Every location routed to finco_radar_upstream corresponds 1-to-1 to a real,
# verified route in radar_service.app:app. No broad /api/v1/ or /api/v1.1/ takeover.

upstream finco_model_upstream {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream finco_radar_upstream {
    server 127.0.0.1:8010;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Hard block: internal Model auth introspection endpoint must NEVER be publicly reachable
    location ^~ /internal/ {
        return 403;
    }

    # --- Standalone FINCO Radar / Crypto / Yield routes (verified parity) ---
    location = /radar {
        proxy_pass http://finco_radar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /radar/ {
        proxy_pass http://finco_radar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /yield {
        proxy_pass http://finco_radar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /yield/ {
        proxy_pass http://finco_radar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /crypto {
        proxy_pass http://finco_radar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /crypto/ {
        proxy_pass http://finco_radar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/radar/ {
        proxy_pass http://finco_radar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/crypto/tokenized {
        proxy_pass http://finco_radar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/crypto/yield {
        proxy_pass http://finco_radar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1.1/radar/r-live/ {
        proxy_pass http://finco_radar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1.1/radar/rwa-basis {
        proxy_pass http://finco_radar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1.1/radar/bridge {
        proxy_pass http://finco_radar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- FINCO Financial Model routes (default authority) ---
    location / {
        proxy_pass http://finco_model_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
