name: Radar Independent CI & Release Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar-standalone-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build shared contract and Radar wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist packages/finco-evidence-envelope
          python -m build --wheel --outdir dist .
          sha256sum dist/*.whl > dist/WHEEL_SHA256SUMS.txt
          cat dist/WHEEL_SHA256SUMS.txt
      - name: Install wheels into clean isolated venv and verify zero Model leakage
        run: |
          python -m venv /tmp/radar-ci-venv
          /tmp/radar-ci-venv/bin/pip install --find-links dist dist/finco_evidence_envelope-0.1.0-py3-none-any.whl dist/finco_radar-0.1.0-py3-none-any.whl pytest==9.0.3
          /tmp/radar-ci-venv/bin/pip check
          /tmp/radar-ci-venv/bin/pip list --format=freeze > dist/pip-freeze.txt
      - name: Stage isolated test directory (no finco_radar/*.py in CWD)
        run: |
          mkdir -p /tmp/radar-isolated-tests/finco_radar/terminal/static
          cp -R tests docs deploy PROVENANCE_FROM_FINCOPROTOCOL.json pyproject.toml /tmp/radar-isolated-tests/
          cp finco_radar/terminal/static/radar_terminal.js /tmp/radar-isolated-tests/finco_radar/terminal/static/radar_terminal.js
      - name: Run full isolated Radar R0-R12, service, auth-boundary and exact-source suite
        run: |
          cd /tmp/radar-isolated-tests
          env -u PYTHONPATH /tmp/radar-ci-venv/bin/python -m pytest -v \
            --junitxml="${GITHUB_WORKSPACE}/dist/radar-ci-junit.xml" \
            tests/
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: radar-standalone-ci-evidence
          path: |
            dist/WHEEL_SHA256SUMS.txt
            dist/pip-freeze.txt
            dist/radar-ci-junit.xml
          if-no-files-found: error
