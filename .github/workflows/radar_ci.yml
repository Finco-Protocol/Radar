name: Radar Independent CI & Release Gate

on:
  push:
    branches: [main, "arch/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar-standalone-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build shared contract and Radar wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist packages/finco-evidence-envelope
          python -m build --wheel --outdir dist .
          sha256sum dist/*.whl > dist/WHEEL_SHA256SUMS.txt
          cat dist/WHEEL_SHA256SUMS.txt
      - name: Install wheels into clean isolated venv and verify installed import origins
        run: |
          python -m venv /tmp/radar-ci-venv
          /tmp/radar-ci-venv/bin/pip install --find-links dist \
            dist/finco_evidence_envelope-0.1.0-py3-none-any.whl \
            "dist/finco_radar-0.2.0-py3-none-any.whl[test,server]"
          /tmp/radar-ci-venv/bin/pip check
          /tmp/radar-ci-venv/bin/pip list --format=freeze > dist/pip-freeze.txt
          env -u PYTHONPATH /tmp/radar-ci-venv/bin/python - <<'PY'
          from pathlib import Path
          import finco_radar, finco_yield, radar_service, finco_protocol.verification.envelope as env_mod
          for mod in (finco_radar, finco_yield, radar_service, env_mod):
              p = Path(mod.__file__).resolve()
              assert "site-packages" in p.parts, f"Not imported from site-packages: {p}"
              print("VERIFIED_INSTALLED_ORIGIN:", mod.__name__, "->", p)
          PY
      - name: Stage isolated test directory (zero source packages in CWD)
        run: |
          mkdir -p /tmp/radar-isolated-tests/finco_radar/terminal/static
          cp -R tests docs deploy PROVENANCE_FROM_FINCOPROTOCOL.json PROVENANCE_ADAPTATIONS_V2.json pyproject.toml /tmp/radar-isolated-tests/
          cp finco_radar/terminal/static/radar_terminal.js /tmp/radar-isolated-tests/finco_radar/terminal/static/radar_terminal.js
      - name: Run full isolated Radar/Yield/Crypto/Service/Collector/Governance suite
        run: |
          cd /tmp/radar-isolated-tests
          env -u PYTHONPATH /tmp/radar-ci-venv/bin/python -m pytest -v \
            --junitxml="${GITHUB_WORKSPACE}/dist/radar-ci-junit.xml" \
            tests/
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("${GITHUB_WORKSPACE}/dist/radar-ci-junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests = int(suite.attrib.get("tests", "0"))
          failures = int(suite.attrib.get("failures", "0"))
          errors = int(suite.attrib.get("errors", "0"))
          skipped = int(suite.attrib.get("skipped", "0"))
          print(f"AGGREGATE_GATE: tests={tests} failures={failures} errors={errors} skipped={skipped}")
          assert tests >= 1150, f"Too few tests executed: {tests}"
          assert failures == 0 and errors == 0 and skipped == 0
          PY
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: radar-standalone-ci-evidence
          path: |
            dist/WHEEL_SHA256SUMS.txt
            dist/pip-freeze.txt
            dist/radar-ci-junit.xml
          if-no-files-found: error
